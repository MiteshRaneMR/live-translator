name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|AAPT|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: Bayan-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to a rolling release
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/bayan.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/bayan.apk --target "$GITHUB_SHA" --prerelease --title "Latest build" --notes "Built from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
